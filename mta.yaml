_schema-version: "3.1"
ID: psasprint
version: 1.0.0
description: "psasprint — Project and Services Administration Application for SAP BTP with SAP HANA"

parameters:
  enable-parallel-deployments: true

build-parameters:
  before-all:
    - builder: custom
      commands:
        - npm install --legacy-peer-deps
        - npx cds build --production

modules:
  # ---------------------------------------------------------------------------
  # CAP Node.js Service Module
  # ---------------------------------------------------------------------------
  - name: psasprint-srv
    type: nodejs
    path: gen/srv
    parameters:
      buildpack: nodejs_buildpack
      memory: 256M
      disk-quota: 512M
    requires:
      - name: psasprint-db
      - name: psasprint-auth
    provides:
      - name: srv-api
        properties:
          srv-url: ${default-url}

  # ---------------------------------------------------------------------------
  # SAP HANA HDI Container Deployer Module
  # ---------------------------------------------------------------------------
  - name: psasprint-db-deployer
    type: hdb
    path: gen/db
    parameters:
      buildpack: nodejs_buildpack
      memory: 256M
      disk-quota: 512M
    requires:
      - name: psasprint-db

  # ---------------------------------------------------------------------------
  # Frontend Application Router
  # ---------------------------------------------------------------------------
  - name: psasprint-app
    type: approuter.nodejs
    path: app
    parameters:
      disk-quota: 512M
      memory: 256M
    build-parameters:
      builder: custom
      commands:
        - npm install --production
    requires:
      - name: srv-api
        group: destinations
        properties:
          name: srv-api
          url: ~{srv-url}
          forwardAuthToken: true
      - name: psasprint-auth

# ---------------------------------------------------------------------------
# Required Cloud Foundry Services & Resources
# ---------------------------------------------------------------------------
resources:
  # Production SAP HANA Cloud HDI Container
  - name: psasprint-db
    type: com.sap.xs.hdi-container
    parameters:
      service: hana
      service-plan: hdi-shared
      config:
        schema: PSASPRINT_HDI

  # SAP BTP XSUAA Service for Identity & Authentication
  - name: psasprint-auth
    type: org.cloudfoundry.managed-service
    parameters:
      service: xsuaa
      service-plan: application
      path: xs-security.json
      config:
        xsappname: psasprint
        tenant-mode: dedicated
